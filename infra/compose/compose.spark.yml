services:
  api:
    build:
      context: ../..
      dockerfile: infra/containers/api.Dockerfile
    environment:
      HSJS_PROVIDER_STUB_MODE: "true"
      HSJS_PROVIDER_RUNTIME: "transformers"
      HSJS_HF_DEVICE: "auto"
      # Job DB on a named volume: jobs must survive container recreation.
      HSJS_DB_PATH: "/data/jobs.db"
    volumes:
      - job-data:/data
    ports:
      - "8000:8000"
  inference:
    build:
      context: ../..
      dockerfile: infra/containers/inference.cuda.Dockerfile
    profiles: ["dgx-spark"]

volumes:
  job-data:
